<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Support Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.2rem; color: #e94560; }
        header p { font-size: 0.8rem; color: #888; margin-top: 2px; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #0f3460;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }
        .assistant {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
            border-bottom-left-radius: 4px;
        }

        .message pre {
            background: #0d0d1a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.88em;
        }
        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        .message ul, .message ol { padding-left: 20px; margin-bottom: 8px; }
        .message li { margin-bottom: 4px; }

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 16px;
        }
        .typing span {
            width: 8px;
            height: 8px;
            background: #e94560;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        #input-area {
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            background: #0d0d1a;
            border: 1px solid #0f3460;
            color: #e0e0e0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1rem;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }
        #message-input:focus { border-color: #e94560; }
        #message-input::placeholder { color: #555; }
        #send-btn {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 1rem;
            cursor: pointer;
            height: 44px;
            white-space: nowrap;
            transition: background 0.15s;
        }
        #send-btn:disabled { background: #444; cursor: not-allowed; }
        #send-btn:hover:not(:disabled) { background: #c73652; }
    </style>
</head>
<body>
    <header>
        <h1>Coding Support Agent</h1>
        <p>Ask anything — debug, explain, write code, any language</p>
    </header>

    <div id="chat">
        <div class="message assistant">
            <p>Hi! I'm your coding assistant. Ask me anything — debugging, explanations, code snippets, any language.</p>
        </div>
    </div>

    <div id="input-area">
        <textarea
            id="message-input"
            placeholder="Ask a coding question... (Enter to send, Shift+Enter for newline)"
            rows="1"
        ></textarea>
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        marked.setOptions({ breaks: true });

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'assistant') {
                div.innerHTML = marked.parse(content);
            } else {
                div.textContent = content;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant typing';
            div.id = 'typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            input.style.height = '44px';
            sendBtn.disabled = true;

            addMessage('user', message);
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });
                const data = await res.json();
                hideTyping();
                if (!res.ok) {
                    addMessage('assistant', `Error: ${data.error || 'Something went wrong. Please try again.'}`);
                } else {
                    addMessage('assistant', data.reply);
                }
            } catch {
                hideTyping();
                addMessage('assistant', 'Connection error. Is the server running?');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = '44px';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
        });
    </script>
</body>
</html>
